<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Inclui o titulo do site e o icone que aprece no navegador-->
    <title>Produtos Motosupri</title>
    <link rel="icon" href="logo/logovetorizadatitulo.png" type="image/png">
    <!-- Inclui o Tailwind CSS via CDN para estilização responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inclui as bibliotecas React, ReactDOM e Babel via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Inclui Font Awesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
      /* Font Inter from Google Fonts */
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
</head>
<body class="bg-gray-50 antialiased">
    <div id="root"></div>

    <script type="text/babel">
        // O componente principal do seu aplicativo React
        function App() {
            // --- ESTADOS DO COMPONENTE ---
            const [searchTerm, setSearchTerm] = React.useState('');
            const [searchResults, setSearchResults] = React.useState([]);
            const [suggestions, setSuggestions] = React.useState([]);
            const [message, setMessage] = React.useState('');
            
            const [products, setProducts] = React.useState([]);
            const [sortedProducts, setSortedProducts] = React.useState([]);
            const [isLoading, setIsLoading] = React.useState(true);

            // Estados para a nova funcionalidade
            const [showAllProducts, setShowAllProducts] = React.useState(false);
            const [viewMode, setViewMode] = React.useState('grid');
            const [listSearchTerm, setListSearchTerm] = React.useState(''); // Novo estado para o filtro da lista
            
            // Estado para o modal
            const [modalProduct, setModalProduct] = React.useState(null);

            // Estados para paginação
            const [currentPage, setCurrentPage] = React.useState(1);
            const [itemsPerPage, setItemsPerPage] = React.useState(20);


            // --- EFEITO PARA CARREGAR OS DADOS ---
            React.useEffect(() => {
                fetch('products.json')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Erro de rede ao carregar o arquivo de produtos.');
                        }
                        return response.json();
                    })
                    .then(data => {
                        const productList = data.Produtos || [];
                        setProducts(productList);
                        
                        const sorted = [...productList].sort((a, b) => 
                            a.description.localeCompare(b.description, 'pt-BR', { sensitivity: 'base' })
                        );
                        setSortedProducts(sorted);

                        setIsLoading(false);
                    })
                    .catch(error => {
                        console.error("Falha ao carregar o banco de dados de produtos:", error);
                        setMessage("Erro ao carregar a base de dados. Verifique o arquivo products.json e o console.");
                        setIsLoading(false);
                    });
            }, []);

            // Função para realizar a busca principal
            const performSearch = (term) => {
                if (term.trim() === '') {
                    return [];
                }
                
                const searchKeywords = term.trim().toLowerCase().split(' ').filter(Boolean);

                const results = products.filter(product => {
                    const productText = `${product.code || ''} ${product.description || ''} ${product.brand || ''}`.toLowerCase();
                    
                    return searchKeywords.every(keyword => {
                        const regex = new RegExp(`\\b${keyword}`, 'i');
                        return regex.test(productText);
                    });
                });
                return results;
            };

            // Função para o botão "Buscar"
            const handleSearch = () => {
                const results = performSearch(searchTerm);
                setSearchResults(results);
                setSuggestions([]); 

                if (searchTerm.trim() === '') {
                    setMessage('Por favor, digite um termo para buscar.');
                } else if (results.length > 0) {
                    setMessage(`${results.length} produto(s) encontrado(s).`);
                } else {
                    setMessage('Nenhum produto encontrado para sua busca.');
                }
                setSearchTerm(''); 
            };

            // Atualiza as sugestões enquanto o usuário digita
            const handleInputChange = (event) => {
                const value = event.target.value;
                setSearchTerm(value);
                setSearchResults([]); 
                setMessage('');

                if (value.trim() === '') {
                    setSuggestions([]);
                } else {
                    const results = performSearch(value);
                    setSuggestions(results.slice(0, 10));
                }
            };

            // Ação ao clicar em uma sugestão
            const handleSuggestionClick = (product) => {
                setSearchTerm(''); 
                setSuggestions([]); 
                setSearchResults([product]); 
                setMessage('1 produto encontrado.');
            };

            // **NOVA FUNÇÃO**: Atualiza o filtro da lista de todos os produtos
            const handleListFilterChange = (event) => {
                setListSearchTerm(event.target.value);
                setCurrentPage(1); // Reseta para a primeira página ao filtrar
            };
            
            // Funções para o modal
            const openModal = (product) => {
                setModalProduct(product);
            };

            const closeModal = () => {
                setModalProduct(null);
            };

            // **LÓGICA DE FILTRO E PAGINAÇÃO COMBINADAS**
            const filteredProducts = sortedProducts.filter(product => {
                const productText = `${product.code || ''} ${product.description || ''} ${product.brand || ''}`.toLowerCase();
                return productText.includes(listSearchTerm.toLowerCase());
            });

            const indexOfLastItem = currentPage * itemsPerPage;
            const indexOfFirstItem = indexOfLastItem - itemsPerPage;
            const currentItems = filteredProducts.slice(indexOfFirstItem, indexOfLastItem);
            const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);

            const paginate = (pageNumber) => setCurrentPage(pageNumber);

            if (isLoading) {
                return <div className="min-h-screen flex justify-center items-center"><p className="text-xl text-[#BA903C]">Carregando produtos...</p></div>;
            }

            return (
                <div className="min-h-screen bg-white flex flex-col items-center p-4 font-sans antialiased">
                    <header className="w-full max-w-4xl bg-white shadow-md rounded-lg p-4 mb-8 flex justify-center items-center">
                        <img
                            src="logo/logovetorizada.png"
                            alt="Logo da Empresa"
                            className="h-32 w-auto rounded-md"
                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/200x80/E5E7EB/cc9604?text=Logo+Indisponível'; }}
                        />
                    </header>

                    <main className="w-full max-w-4xl bg-white shadow-md rounded-lg p-6">
                        <h1 className="text-2xl md:text-3xl font-bold text-[#BA903C] mb-6 text-center">Busca de Produtos</h1>

                        <div className="flex flex-col sm:flex-row gap-4 mb-6">
                            <div className="relative flex-1">
                                <input
                                    type="text"
                                    id="productCode"
                                    className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#cc9604] text-gray-800 placeholder-gray-500 bg-white"
                                    placeholder="Busque por código, descrição ou marca..."
                                    value={searchTerm}
                                    onChange={handleInputChange}
                                    onKeyPress={(e) => e.key === 'Enter' && handleSearch()}
                                    autoComplete="off" 
                                />
                                {suggestions.length > 0 && (
                                    <ul className="absolute z-20 w-full bg-white border border-gray-300 rounded-lg mt-1 max-h-80 overflow-y-auto shadow-lg">
                                        {suggestions.map(suggestion => (
                                            <li
                                                key={suggestion.code}
                                                className="p-3 hover:bg-gray-100 cursor-pointer text-sm text-gray-700"
                                                onClick={() => handleSuggestionClick(suggestion)}
                                            >
                                                <span className="font-bold">{suggestion.code}</span> - {suggestion.description}
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                            <button
                                onClick={handleSearch}
                                className="px-6 py-3 bg-[#cc9604] text-white font-semibold rounded-lg shadow-md hover:bg-[#ac8503] focus:outline-none focus:ring-2 focus:ring-[#cc9604] focus:ring-offset-2 transition duration-200 ease-in-out"
                            >
                                Buscar Produto
                            </button>
                        </div>

                        <div id="resultArea" className="mt-8 flex flex-col items-center">
                            {message && (
                                <p className={`text-lg mb-4 ${searchResults.length > 0 ? 'text-green-600' : 'text-red-600'} text-center font-semibold`}>
                                    {message}
                                </p>
                            )}

                            {searchResults.length > 0 && (
                                <div className="w-full flex flex-col items-center space-y-6">
                                    {searchResults.map(product => (
                                        <div key={product.code} className="w-full max-w-md flex flex-col items-center border border-gray-200 rounded-lg p-4 shadow-sm">
                                            <img
                                                src={product.imageUrl.replace(/\\/g, '/')}
                                                alt="Imagem do Produto"
                                                className="w-[350px] h-[350px] object-contain rounded-lg shadow-lg border border-gray-300 transition-transform duration-300 hover:scale-105 cursor-pointer"
                                                onClick={() => openModal(product)}
                                                onError={(e) => {
                                                    e.target.onerror = null;
                                                    e.target.src = 'https://placehold.co/350x350/FF0000/FFFFFF?text=Imagem+Indisponível';
                                                }}
                                            />
                                            <div className="text-center mt-4">
                                                <p className="font-bold text-lg text-gray-900">Código: {product.code}</p>
                                                <p className="text-gray-800 text-base px-2 mt-1">
                                                    {product.description}
                                                </p>
                                                {product.brand && (
                                                    <p className="text-sm text-white bg-[#BA903C] rounded-full px-3 py-1 mt-2 inline-block font-semibold">
                                                        Marca: {product.brand}
                                                    </p>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        <div className="mt-10 pt-6 border-t border-gray-200">
                            <div className="text-center">
                                <button
                                    onClick={() => {
                                        setShowAllProducts(!showAllProducts);
                                        setCurrentPage(1); 
                                    }}
                                    className="px-6 py-3 bg-gray-700 text-white font-semibold rounded-lg shadow-md hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition duration-200 ease-in-out"
                                >
                                    {showAllProducts ? 'Ocultar Todos os Produtos' : 'Ver Todos os Produtos'}
                                </button>
                            </div>

                            {showAllProducts && (
                                <div className="mt-6">
                                    <div className="flex justify-center gap-4 mb-6">
                                        <button onClick={() => { setViewMode('grid'); setCurrentPage(1); }} className={`px-4 py-2 rounded-lg font-semibold ${viewMode === 'grid' ? 'bg-[#cc9604] text-white' : 'bg-gray-200 text-gray-700'}`}>
                                            <i className="fas fa-th-large mr-2"></i>Ver Cartões
                                        </button>
                                        <button onClick={() => { setViewMode('list'); setCurrentPage(1); }} className={`px-4 py-2 rounded-lg font-semibold ${viewMode === 'list' ? 'bg-[#cc9604] text-white' : 'bg-gray-200 text-gray-700'}`}>
                                            <i className="fas fa-list mr-2"></i>Ver Lista
                                        </button>
                                    </div>
                                    
                                    {/* **NOVO CAMPO DE FILTRO** */}
                                    <div className="mb-6">
                                        <input
                                            type="text"
                                            className="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#cc9604] text-gray-800 placeholder-gray-500 bg-white"
                                            placeholder="Filtrar produtos por código, descrição ou marca..."
                                            value={listSearchTerm}
                                            onChange={handleListFilterChange}
                                            autoComplete="off"
                                        />
                                    </div>


                                    {viewMode === 'grid' ? (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                            {currentItems.map(product => (
                                                <div key={product.code} className="border rounded-lg p-4 flex flex-col items-center text-center shadow-md transition-shadow hover:shadow-xl">
                                                    <img 
                                                        src={product.imageUrl.replace(/\\/g, '/')} 
                                                        alt={product.description} 
                                                        className="w-full h-40 object-contain mb-4 rounded-md cursor-pointer"
                                                        onClick={() => openModal(product)}
                                                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/150x150/f0f0f0/ccc?text=Sem+Foto'; }}
                                                    />
                                                    <p className="text-sm font-bold text-gray-800">Código: {product.code}</p>
                                                    <p className="text-sm font-semibold text-gray-700 flex-grow mt-1">{product.description}</p>
                                                    {product.brand && <p className="text-xs text-white bg-[#BA903C] rounded-full px-2 py-1 mt-2 inline-block">{product.brand}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            {currentItems.map(product => (
                                                <div key={product.code} className="flex items-center p-3 border rounded-lg shadow-sm hover:bg-gray-50">
                                                    <img 
                                                        src={product.imageUrl.replace(/\\/g, '/')} 
                                                        alt={product.description} 
                                                        className="w-16 h-16 object-contain rounded-md mr-4 cursor-pointer"
                                                        onClick={() => openModal(product)}
                                                        onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/64x64/f0f0f0/ccc?text=N/A'; }}
                                                    />
                                                    <div className="flex-grow">
                                                        <p className="font-bold text-gray-800">{product.code}</p>
                                                        <p className="text-sm text-gray-600">{product.description}</p>
                                                    </div>
                                                    {product.brand && <p className="text-xs text-white bg-[#BA903C] rounded-full px-3 py-1 ml-4">{product.brand}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {totalPages > 1 && (
                                        <div className="flex justify-center items-center mt-8 space-x-2 sm:space-x-4">
                                            <button
                                                onClick={() => paginate(currentPage - 1)}
                                                disabled={currentPage === 1}
                                                className="px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                Anterior
                                            </button>
                                            <span className="text-gray-700 font-semibold text-sm sm:text-base">
                                                Página {currentPage} de {totalPages}
                                            </span>
                                            <button
                                                onClick={() => paginate(currentPage + 1)}
                                                disabled={currentPage === totalPages}
                                                className="px-4 py-2 bg-gray-200 text-gray-700 font-semibold rounded-lg hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed"
                                            >
                                                Próxima
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                    </main>

                    {modalProduct && (
                        <div
                            className="fixed inset-0 bg-black bg-opacity-75 flex justify-center items-center z-50 p-4"
                            onClick={closeModal}
                        >
                            <div
                                className="relative bg-white p-4 rounded-lg shadow-xl flex flex-col items-center justify-center"
                                onClick={(e) => e.stopPropagation()}
                            >
                                <button
                                    onClick={closeModal}
                                    className="absolute top-2 right-2 bg-red-500 text-white hover:bg-red-600 rounded-full w-8 h-8 flex items-center justify-center text-xl font-bold shadow-md z-10"
                                    title="Fechar"
                                >
                                    &times;
                                </button>
                                <img
                                    src={modalProduct.imageUrl.replace(/\\/g, '/')}
                                    alt="Imagem do Produto em Tamanho Real"
                                    className="max-w-[90vw] max-h-[85vh] object-contain"
                                     onError={(e) => { e.target.onerror = null; e.target.src = 'https://placehold.co/600x600/FF0000/FFFFFF?text=Imagem+Indisponível'; }}
                                />
                                <p className="text-center font-semibold mt-2">{modalProduct.description}</p>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Monta o componente App na div com id="root"
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
